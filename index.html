<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tools - javagrant.ac.nz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'media',
            theme: {
                extend: {
                    colors: {
                        cyan: { DEFAULT: '#0891b2', light: '#06b6d4' },
                        pink: { DEFAULT: '#db2777', light: '#ec4899' },
                        purple: { DEFAULT: '#7c3aed', light: '#8b5cf6' },
                    }
                }
            }
        }
    </script>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%2316213e' width='100' height='100' rx='20'/><text y='.9em' x='50%' text-anchor='middle' font-size='70'>⚒</text></svg>">
</head>
<body class="min-h-screen bg-gray-50 dark:bg-gray-950 text-gray-900 dark:text-gray-100 font-sans antialiased transition-colors duration-200">
    <main class="max-w-5xl mx-auto px-8 py-16">
        <header class="text-center py-12">
            <h1 class="text-5xl font-bold flex items-center justify-center gap-4 mb-4">
                <span class="text-cyan-light dark:text-cyan">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
                    </svg>
                </span>
                Tools
            </h1>
            <p class="text-gray-500 dark:text-gray-400 text-lg">Handy utilities for everyday tasks</p>
        </header>

        <section class="mb-12">
            <header class="mb-6">
                <h2 class="text-xl font-semibold text-gray-900 dark:text-gray-100 flex items-center gap-2 pb-4 border-b border-gray-200 dark:border-gray-800">
                    <span class="text-cyan">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/>
                            <line x1="8" y1="21" x2="16" y2="21"/>
                            <line x1="12" y1="17" x2="12" y2="21"/>
                        </svg>
                    </span>
                    Display
                </h2>
            </header>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <a href="tools/exam-clock.html" class="group flex items-center gap-5 p-6 bg-white dark:bg-gray-900 rounded-2xl border border-gray-200 dark:border-gray-800 shadow-sm hover:shadow-md hover:border-cyan/50 dark:hover:border-cyan transition-all duration-200 no-underline text-gray-900 dark:text-gray-100">
                    <div class="w-14 h-14 flex items-center justify-center bg-cyan/10 dark:bg-cyan/20 rounded-xl text-cyan">
                        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"/>
                            <polyline points="12 6 12 12 16 14"/>
                        </svg>
                    </div>
                    <div class="flex-1 min-w-0">
                        <h3 class="text-lg font-semibold mb-1">Exam Clock</h3>
                        <p class="text-gray-500 dark:text-gray-400 text-sm">Large time display for exams and timed sessions</p>
                    </div>
                    <svg class="w-5 h-5 text-gray-300 dark:text-gray-600 group-hover:text-cyan group-hover:translate-x-1 transition-all" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"/>
                        <polyline points="12 5 19 12 12 19"/>
                    </svg>
                </a>
                <a href="tools/event-viewer.html" class="group flex items-center gap-5 p-6 bg-white dark:bg-gray-900 rounded-2xl border border-gray-200 dark:border-gray-800 shadow-sm hover:shadow-md hover:border-cyan/50 dark:hover:border-cyan transition-all duration-200 no-underline text-gray-900 dark:text-gray-100">
                    <div class="w-14 h-14 flex items-center justify-center bg-cyan/10 dark:bg-cyan/20 rounded-xl text-cyan">
                        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M15 15l-2 5L9 9l11 4-5 2zm0 0l5 5"/>
                        </svg>
                    </div>
                    <div class="flex-1 min-w-0">
                        <h3 class="text-lg font-semibold mb-1">Event Viewer</h3>
                        <p class="text-gray-500 dark:text-gray-400 text-sm">Live display of mouse, keyboard, and touch events</p>
                    </div>
                    <svg class="w-5 h-5 text-gray-300 dark:text-gray-600 group-hover:text-cyan group-hover:translate-x-1 transition-all" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"/>
                        <polyline points="12 5 19 12 12 19"/>
                    </svg>
                </a>
            </div>
        </section>
    </main>
</body>
</html>
