<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tools - javagrant.ac.nz</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #eee;
            min-height: 100vh;
            padding: 2rem;
        }
        h1 {
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 3rem;
            color: #00d9ff;
        }
        h2 {
            color: #00d9ff;
            margin-bottom: 1rem;
            font-size: 1.5rem;
            border-bottom: 2px solid #00d9ff;
            padding-bottom: 0.5rem;
        }
        .category {
            margin-bottom: 3rem;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
        }
        .tools {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 1rem;
        }
        .tool-link {
            display: block;
            background: #16213e;
            color: #eee;
            padding: 1.5rem;
            border-radius: 8px;
            text-decoration: none;
            transition: transform 0.2s, background 0.2s;
            border: 1px solid #0f3460;
        }
        .tool-link:hover {
            transform: translateY(-3px);
            background: #1f4068;
            border-color: #00d9ff;
        }
        .tool-link h3 {
            margin-bottom: 0.5rem;
            color: #00d9ff;
        }
        .tool-link p {
            font-size: 0.9rem;
            color: #aaa;
        }
    </style>
</head>
<body>
    <h1>Tools</h1>

    <div class="category">
        <h2>Display</h2>
        <div class="tools">
            <a href="tools/event-viewer.html" class="tool-link">
                <h3>Event Information Viewer</h3>
                <p>Displays event listener information in real-time</p>
            </a>
            <a href="tools/exam-clock.html" class="tool-link">
                <h3>Exam Clock</h3>
                <p>Large display showing current time for exams</p>
            </a>
        </div>
    </div>
</body>
</html>
