<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Viewer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'media',
            theme: {
                extend: {
                    colors: {
                        cyan: { DEFAULT: '#0891b2', light: '#06b6d4' },
                        pink: { DEFAULT: '#db2777', light: '#ec4899' },
                        purple: { DEFAULT: '#7c3aed', light: '#8b5cf6' },
                    }
                }
            }
        }
    </script>
</head>
<body class="min-h-screen bg-gray-50 dark:bg-gray-950 text-gray-900 dark:text-gray-100 font-sans antialiased transition-colors duration-200">
    <main class="max-w-4xl mx-auto px-8 py-10">
        <a href="../index.html" class="inline-flex items-center gap-2 text-gray-400 dark:text-gray-500 hover:text-cyan text-sm mb-6 no-underline transition-colors">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"/>
                <polyline points="12 19 5 12 12 5"/>
            </svg>
            Back
        </a>

        <header class="mb-8">
            <h1 class="text-3xl font-bold flex items-center gap-3">
                <span class="text-cyan">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M15 15l-2 5L9 9l11 4-5 2zm0 0l5 5"/>
                    </svg>
                </span>
                Event Viewer
            </h1>
        </header>

        <div class="bg-white dark:bg-gray-900 rounded-xl border border-gray-200 dark:border-gray-800 p-4 mb-6">
            <p class="text-gray-500 dark:text-gray-400 text-sm">Move your mouse, click, press keys, or scroll to see events captured in real-time.</p>
        </div>

        <button onclick="clearLog()" class="mb-4 px-5 py-2.5 bg-white dark:bg-gray-900 text-pink dark:text-pink-light border border-pink/30 dark:border-pink/50 rounded-lg hover:shadow-md transition-all text-sm font-medium">
            Clear Log
        </button>

        <div id="event-log" class="bg-white dark:bg-gray-900 rounded-xl border border-gray-200 dark:border-gray-800 p-4 h-[55vh] overflow-y-auto font-mono text-sm"></div>
    </main>

    <script>
        const log = document.getElementById('event-log');
        let eventCount = 0;

        function logEvent(event) {
            eventCount++;
            const entry = document.createElement('div');
            entry.className = 'flex gap-4 py-2 border-b border-gray-100 dark:border-gray-800 last:border-0';

            const timestamp = document.createElement('span');
            timestamp.className = 'text-gray-400 dark:text-gray-600 min-w-[50px]';
            timestamp.textContent = eventCount;

            const type = document.createElement('span');
            type.className = 'text-cyan dark:text-cyan-light font-semibold min-w-[100px]';
            type.textContent = event.type;

            const target = document.createElement('span');
            target.className = 'text-purple dark:text-purple-light';
            target.textContent = event.target.tagName || 'Window';

            const data = document.createElement('span');
            data.className = 'text-gray-500 dark:text-gray-400 flex-1';
            let dataStr = '';
            if (event.clientX !== undefined) dataStr += `X:${event.clientX} Y:${event.clientY}`;
            if (event.key) dataStr += ` Key:${event.key}`;
            if (event.button !== undefined) dataStr += ` Btn:${event.button}`;
            data.textContent = dataStr;

            entry.append(timestamp, type, target, data);
            log.appendChild(entry);
            log.scrollTop = log.scrollHeight;
        }

        function clearLog() {
            log.innerHTML = '';
            eventCount = 0;
        }

        ['mousemove', 'mousedown', 'mouseup', 'click', 'dblclick'].forEach(type => document.addEventListener(type, logEvent));
        ['keydown', 'keyup', 'keypress'].forEach(type => document.addEventListener(type, logEvent));
        ['touchstart', 'touchend', 'touchmove'].forEach(type => document.addEventListener(type, logEvent));
        document.addEventListener('wheel', logEvent);
        ['focus', 'blur'].forEach(type => document.addEventListener(type, logEvent));
    </script>
</body>
</html>
