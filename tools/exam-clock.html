<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Clock</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0f0f1a',
                        secondary: '#1a1a2e',
                        card: '#16213e',
                        cardhover: '#1f2b4d',
                        cyan: '#00d9ff',
                        pink: '#ff006e',
                        purple: '#8b5cf6',
                    }
                }
            }
        }
    </script>
    <style>
        body { background: #0f0f1a; }
        .pulse-separator { animation: pulse 1s ease-in-out infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    </style>
</head>
<body class="min-h-screen text-white font-sans antialiased flex flex-col items-center justify-center">
    <a href="../index.html" class="absolute top-6 left-6 text-gray-400 hover:text-cyan flex items-center gap-2 text-sm no-underline transition-colors">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"/>
            <polyline points="12 19 5 12 12 5"/>
        </svg>
        Back
    </a>

    <div class="text-center">
        <div id="time" class="text-9xl md:text-[12rem] font-extralight tracking-tighter leading-none tabular-nums">
            <span id="hours">00</span><span class="text-cyan pulse-separator">:</span><span id="minutes">00</span><span id="seconds-container"><span class="text-cyan pulse-separator">:</span><span id="seconds">00</span></span>
        </div>
        <div id="date" class="text-xl md:text-2xl text-gray-400 mt-6">Loading...</div>
        <div id="tz-display" class="text-gray-600 mt-2 text-sm"></div>
    </div>

    <div class="flex gap-3 mt-10">
        <button onclick="toggleSeconds()" class="px-5 py-2.5 bg-card text-cyan border border-gray-700 rounded-lg hover:bg-cardhover hover:border-cyan transition-all text-sm font-medium">
            Toggle Seconds
        </button>
        <button onclick="toggleDate()" class="px-5 py-2.5 bg-card text-cyan border border-gray-700 rounded-lg hover:bg-cardhover hover:border-cyan transition-all text-sm font-medium">
            Toggle Date
        </button>
    </div>

    <script>
        const hoursEl = document.getElementById('hours');
        const minutesEl = document.getElementById('minutes');
        const secondsEl = document.getElementById('seconds');
        const secondsContainer = document.getElementById('seconds-container');
        const dateEl = document.getElementById('date');
        const tzEl = document.getElementById('tz-display');

        let showSeconds = true;
        let showDate = true;

        function updateTime() {
            const now = new Date();
            hoursEl.textContent = String(now.getHours()).padStart(2, '0');
            minutesEl.textContent = String(now.getMinutes()).padStart(2, '0');
            secondsEl.textContent = String(now.getSeconds()).padStart(2, '0');
            secondsContainer.style.display = showSeconds ? 'inline' : 'none';

            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            dateEl.textContent = now.toLocaleDateString('en-NZ', options);
            dateEl.style.display = showDate ? 'block' : 'none';

            tzEl.textContent = now.toLocaleTimeString('en-NZ', { timeZoneName: 'short' }).split(' ').slice(2).join(' ');
        }

        function toggleSeconds() { showSeconds = !showSeconds; }
        function toggleDate() { showDate = !showDate; }

        updateTime();
        setInterval(updateTime, 1000);
    </script>
</body>
</html>
