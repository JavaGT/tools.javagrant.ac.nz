<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Clock</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['DM Sans', 'system-ui', 'sans-serif'],
                    },
                    colors: {
                        accent: {
                            DEFAULT: '#0f766e',
                            light: '#14b8a6',
                            lighter: '#5eead4',
                        },
                    },
                }
            }
        }
    </script>
    <style>
        :root {
            --bg: #fafaf9;
            --bg-card: #ffffff;
            --text: #1c1917;
            --text-muted: #78716c;
            --border: #e7e5e4;
            --accent: #0f766e;
            --accent-light: #14b8a6;
        }
        .dark {
            --bg: #1c1917;
            --bg-card: #292524;
            --text: #fafaf9;
            --text-muted: #a8a29e;
            --border: #44403c;
            --accent: #14b8a6;
            --accent-light: #5eead4;
        }
        body {
            background-color: var(--bg);
            color: var(--text);
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        .card {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            transition: background-color 0.3s ease, border-color 0.3s ease;
        }
        .text-muted { color: var(--text-muted); }
        .text-accent { color: var(--accent); }
        .text-accent-light { color: var(--accent-light); }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.4s ease both;
        }
    </style>
</head>
<body class="min-h-screen font-sans antialiased flex flex-col items-center justify-center">
    <a href="../index.html" class="absolute top-6 left-6 flex items-center gap-2 text-muted hover:text-accent text-sm font-medium no-underline transition-colors">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"/>
            <polyline points="12 19 5 12 12 5"/>
        </svg>
        Back
    </a>

    <div class="text-center px-4 animate-fade-in">
        <div id="time" class="text-8xl md:text-[10rem] font-light tracking-tight tabular-nums text-accent-light">
            <span id="hours">00</span><span class="text-muted opacity-60">:</span><span id="minutes">00</span><span id="seconds-container"><span class="text-muted opacity-60">:</span><span id="seconds">00</span></span>
        </div>
        <div id="date" class="text-lg md:text-xl text-muted mt-6">Loading...</div>
        <div id="tz-display" class="text-muted opacity-60 mt-2 text-sm"></div>
    </div>

    <div class="flex gap-3 mt-10 animate-fade-in" style="animation-delay: 0.15s;">
        <button id="btn-seconds" onclick="toggleSeconds()" class="card rounded-lg px-5 py-2.5 text-sm font-medium text-muted hover:text-accent hover:border-accent transition-all cursor-pointer">
            Toggle Seconds
        </button>
        <button id="btn-date" onclick="toggleDate()" class="card rounded-lg px-5 py-2.5 text-sm font-medium text-muted hover:text-accent hover:border-accent transition-all cursor-pointer">
            Toggle Date
        </button>
    </div>

    <script>
        const hoursEl = document.getElementById('hours');
        const minutesEl = document.getElementById('minutes');
        const secondsEl = document.getElementById('seconds');
        const secondsContainer = document.getElementById('seconds-container');
        const dateEl = document.getElementById('date');
        const tzEl = document.getElementById('tz-display');

        let showSeconds = true;
        let showDate = true;

        function updateTime() {
            const now = new Date();
            hoursEl.textContent = String(now.getHours()).padStart(2, '0');
            minutesEl.textContent = String(now.getMinutes()).padStart(2, '0');
            secondsEl.textContent = String(now.getSeconds()).padStart(2, '0');
            secondsContainer.style.display = showSeconds ? 'inline' : 'none';

            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            dateEl.textContent = now.toLocaleDateString('en-NZ', options);
            dateEl.style.display = showDate ? 'block' : 'none';

            tzEl.textContent = now.toLocaleTimeString('en-NZ', { timeZoneName: 'short' }).split(' ').slice(2).join(' ');
        }

        function toggleSeconds() { showSeconds = !showSeconds; }
        function toggleDate() { showDate = !showDate; }

        updateTime();
        setInterval(updateTime, 1000);
    </script>
</body>
</html>
