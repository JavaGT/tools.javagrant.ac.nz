<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Clock</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'media',
            theme: {
                extend: {
                    colors: {
                        cyan: { DEFAULT: '#0891b2', light: '#06b6d4' },
                        pink: { DEFAULT: '#db2777', light: '#ec4899' },
                        purple: { DEFAULT: '#7c3aed', light: '#8b5cf6' },
                    }
                }
            }
        }
    </script>
</head>
<body class="min-h-screen bg-gray-50 dark:bg-gray-950 text-gray-900 dark:text-gray-100 font-sans antialiased flex flex-col items-center justify-center transition-colors duration-200">
    <a href="../index.html" class="absolute top-6 left-6 text-gray-400 dark:text-gray-500 hover:text-cyan flex items-center gap-2 text-sm no-underline transition-colors">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"/>
            <polyline points="12 19 5 12 12 5"/>
        </svg>
        Back
    </a>

    <div class="text-center px-4">
        <div id="time" class="text-8xl md:text-[10rem] font-light tracking-tight tabular-nums text-gray-900 dark:text-white">
            <span id="hours">00</span><span class="text-cyan dark:text-cyan-light opacity-80">:</span><span id="minutes">00</span><span id="seconds-container"><span class="text-cyan dark:text-cyan-light opacity-80">:</span><span id="seconds">00</span></span>
        </div>
        <div id="date" class="text-lg md:text-xl text-gray-500 dark:text-gray-400 mt-6">Loading...</div>
        <div id="tz-display" class="text-gray-400 dark:text-gray-600 mt-2 text-sm"></div>
    </div>

    <div class="flex gap-3 mt-10">
        <button onclick="toggleSeconds()" class="px-5 py-2.5 bg-white dark:bg-gray-900 text-cyan dark:text-cyan-light border border-gray-200 dark:border-gray-800 rounded-lg hover:shadow-md transition-all text-sm font-medium">
            Toggle Seconds
        </button>
        <button onclick="toggleDate()" class="px-5 py-2.5 bg-white dark:bg-gray-900 text-cyan dark:text-cyan-light border border-gray-200 dark:border-gray-800 rounded-lg hover:shadow-md transition-all text-sm font-medium">
            Toggle Date
        </button>
    </div>

    <script>
        const hoursEl = document.getElementById('hours');
        const minutesEl = document.getElementById('minutes');
        const secondsEl = document.getElementById('seconds');
        const secondsContainer = document.getElementById('seconds-container');
        const dateEl = document.getElementById('date');
        const tzEl = document.getElementById('tz-display');

        let showSeconds = true;
        let showDate = true;

        function updateTime() {
            const now = new Date();
            hoursEl.textContent = String(now.getHours()).padStart(2, '0');
            minutesEl.textContent = String(now.getMinutes()).padStart(2, '0');
            secondsEl.textContent = String(now.getSeconds()).padStart(2, '0');
            secondsContainer.style.display = showSeconds ? 'inline' : 'none';

            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            dateEl.textContent = now.toLocaleDateString('en-NZ', options);
            dateEl.style.display = showDate ? 'block' : 'none';

            tzEl.textContent = now.toLocaleTimeString('en-NZ', { timeZoneName: 'short' }).split(' ').slice(2).join(' ');
        }

        function toggleSeconds() { showSeconds = !showSeconds; }
        function toggleDate() { showDate = !showDate; }

        updateTime();
        setInterval(updateTime, 1000);
    </script>
</body>
</html>
